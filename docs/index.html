<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction Board</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--mut:#6b6b66;--line:#e3e2dd;--acc:#2f5bd3;--good:#1d7a46;--bad:#b3362c;--goodbg:#e3f2e8;--badbg:#f8e4e2;--chip:#efeee9}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--mut:#9c9b95;--line:#2f2f2c;--acc:#7c9cf0;--good:#5cc28a;--bad:#ef7d72;--goodbg:#1c3326;--badbg:#3a2220;--chip:#282826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0}
.kpis{display:flex;gap:18px;flex-wrap:wrap}
.kpi{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:16px;color:var(--ink)}
main{padding:16px;max-width:1500px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input,select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer;background:var(--chip)}button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mut);cursor:pointer;position:sticky;top:0;background:var(--panel)}
td.l,th.l{text-align:left}
tr:hover td{background:var(--chip)}
.pos{color:var(--mut);font-size:12px}
.z{font-size:12px}.zp{color:var(--good)}.zn{color:var(--bad)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.good{background:var(--goodbg);color:var(--good)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.mid{background:var(--chip);color:var(--mut)}
.nom{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.big{font-size:22px;font-weight:700}
.muted{color:var(--mut);font-size:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{border:1px solid var(--line);border-radius:8px;padding:10px}.team.me{border-color:var(--acc)}
.team input{width:100%;font-weight:600;margin-bottom:6px}
.team ul{margin:6px 0 0;padding-left:18px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.mine td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
@media (max-width:600px){main{padding:10px}}
</style>
</head>
<body>
<header>
  <h1>Auction Board <span class="muted">14-team roto · $200 · 10 spots · <a href="h2h.html" style="color:var(--acc)">H2H board →</a></span></h1>
  <div class="kpis" id="kpis"></div>
</header>
<main>
  <section class="card">
    <h2>Nominated player</h2>
    <div class="row">
      <input id="nomInput" list="plist" placeholder="Type a player name…" style="min-width:260px">
      <datalist id="plist"></datalist>
      <label class="muted">Current bid $<input id="curBid" type="number" min="0" style="width:80px"></label>
    </div>
    <div id="nomOut"></div>
    <div class="row" style="margin-top:12px">
      <span class="muted">Sold to</span><select id="soldTeam"></select>
      <span class="muted">for $</span><input id="soldPrice" type="number" min="0" style="width:80px">
      <button class="primary" id="soldBtn">Record sale</button>
      <span id="msg" class="muted"></span>
    </div>
  </section>

  <div class="tabs" id="tabs"></div>
  <section class="card" id="view"></section>
</main>

<script src="players.js"></script>
<script>
const D = window.FANTASY_DATA, S = D.settings, L = D.league, CATS = S.cats;
const STATK = ["FGM","FGA","FTM","FTA","3PM","PTS","REB","AST","STL","BLK","TO"];
const P = D.players.map((p,i)=>({...p,id:i}));
const byName = new Map(P.map(p=>[p.name,p]));
const KEY = "auction-board-v1";

// ---------------------------------------------------------------- state
const defaults = () => ({
  teams: Array.from({length:S.teams},(_,i)=>({name: i===0?"My team":"Team "+(i+1)})),
  me: 0, sales: [], weights: Object.fromEntries(CATS.map(c=>[c,1])), tab:"board", posFilter:"", sortKey:"live", sortDir:-1
});
let st = defaults();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = {...st, ...s}; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };

// ---------------------------------------------------------------- valuation
let M; // derived model, rebuilt on every change
function phi(x){ // standard normal CDF
  const t=1/(1+0.2316419*Math.abs(x)), d=0.3989423*Math.exp(-x*x/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x>0?1-p:p;
}
function rebuild(){
  const w = st.weights;
  P.forEach(p=>{ p.zw = CATS.reduce((s,c)=>s + w[c]*p["z_"+c], 0); });
  const sold = new Map(st.sales.map(s=>[s.pid,s]));
  const avail = P.filter(p=>!sold.has(p.id));
  // replacement = average of the 15 players just below the draftable pool (weighted z)
  const nPool = S.teams*S.roster_spots;
  const sortedAll = [...P].sort((a,b)=>b.zw-a.zw);
  const repl = sortedAll.slice(nPool, nPool+15); const replZ = repl.reduce((s,p)=>s+p.zw,0)/repl.length;
  P.forEach(p=>{ p.vw = (p.zw - replZ)*p.exp_gp/82; });
  // teams
  const teams = st.teams.map((t,i)=>({...t, i, roster:[], spent:0}));
  st.sales.forEach(s=>{ const t=teams[s.team]; t.roster.push({p:P[s.pid],price:s.price}); t.spent+=s.price; });
  teams.forEach(t=>{ t.left = S.budget - t.spent; t.open = S.roster_spots - t.roster.length; t.maxBid = t.open>0 ? t.left : 0; });
  const money = teams.reduce((s,t)=>s+(t.open>0?t.left:0),0), slots = teams.reduce((s,t)=>s+t.open,0);
  // live prices: remaining money split over the best `slots` available players by value over replacement
  const ranked = [...avail].sort((a,b)=>b.vw-a.vw); const top = ranked.slice(0,slots);
  const V = top.reduce((s,p)=>s+Math.max(p.vw,0),0);
  P.forEach(p=>p.live=0); top.forEach(p=>p.live = V>0 ? Math.max(p.vw,0)/V*money : 0);
  // base prices (start of auction, same weights)
  const topAll = [...P].sort((a,b)=>b.vw-a.vw).slice(0,nPool), V0 = topAll.reduce((s,p)=>s+Math.max(p.vw,0),0);
  P.forEach(p=>p.base=0); topAll.forEach(p=>p.base = Math.max(p.vw,0)/V0*S.budget*S.teams);
  const sigma = Object.fromEntries(CATS.map(c=>[c, 0.5*L.team_sigma[c]]));
  M = {avail, ranked, teams, money, slots, sigma, sold, inflation: (()=>{ // money left vs value left at base prices
    const baseLeft = top.reduce((s,p)=>s+p.base,0); return baseLeft>0? money/baseLeft : 1; })()};
  teams.forEach(t=>{ t.fill = fillerFor(t.left, t.open); t.tot = teamTotals(t.roster.map(r=>r.p), t.fill); });
  teams.forEach(t=>{ t.pts = rotoPoints(t.tot, teams.filter(o=>o!==t).map(o=>o.tot)); });
  rankPoints(teams);
  const me = teams[st.me];
  avail.forEach(p=>{ p.dme = deltaMe(p, p.live); });
  avail.forEach(p=>{ p.mymax = maxBid(p); });
}
// expected player bought with `budget` across `open` slots: price-weighted average of available players
// (a wide kernel around budget/open, so the filler has a neutral category profile rather than copying a few players)
function fillerFor(budget, open){
  if (open<=0) return [];
  const target = budget/open, bw = 4 + 0.6*target;
  const pool = M.ranked.slice(0, M.slots + 20).filter(p=>!p._excl);
  const avg = {exp_gp:0, zw:0}; STATK.forEach(k=>avg[k]=0); let W = 0;
  pool.forEach(p=>{ const w = Math.exp(-0.5*((p.live-target)/bw)**2); W += w;
    avg.exp_gp+=w*p.exp_gp; avg.zw+=w*p.zw; STATK.forEach(k=>avg[k]+=w*p[k]); });
  Object.keys(avg).forEach(k=>avg[k]/=W);
  return Array.from({length:open},()=>avg);
}
function teamTotals(players, fill){
  let left = S.active_slots*S.games_cap; const tot = Object.fromEntries(STATK.map(k=>[k,0]));
  [...players, ...fill].sort((a,b)=>b.zw-a.zw).forEach(p=>{
    const g = Math.min(p.exp_gp, left); left -= g; STATK.forEach(k=>tot[k]+=p[k]*g);
  });
  STATK.forEach(k=>tot[k]+=L.replacement_stats[k]*left); // unused games streamed from free agents
  return {FG:tot.FGM/tot.FGA, FT:tot.FTM/tot.FTA, "3PM":tot["3PM"], PTS:tot.PTS, REB:tot.REB, AST:tot.AST, STL:tot.STL, BLK:tot.BLK, TO:tot.TO};
}
// whole-number roto points: rank the 14 projected teams in each category (14 = best, 1 = worst).
// Exact ties (e.g. untouched teams early on) are broken by money left, then team order.
function rankPoints(teams){
  CATS.forEach(c=>{
    const order = [...teams].sort((a,b)=>{ const d = c==="TO" ? a.tot[c]-b.tot[c] : b.tot[c]-a.tot[c];
      return Math.abs(d)>1e-9 ? d : (b.left-a.left) || (a.i-b.i); });
    order.forEach((t,k)=>{ (t.rp ??= {})[c] = teams.length - k; });
  });
  teams.forEach(t=>{ t.rp.total = CATS.reduce((s,c)=>s + (st.weights[c]>0 ? t.rp[c] : 0), 0); });
}
function rotoPoints(mine, others){ // expected rank points per category (14 = best), smoothed for uncertainty
  const out = {}; let total = 0;
  CATS.forEach(c=>{ const s = M.sigma[c]*Math.SQRT2;
    let v = 1; others.forEach(o=>{ const d = c==="TO" ? o[c]-mine[c] : mine[c]-o[c]; v += phi(d/s); });
    out[c] = v; total += v*(st.weights[c]>0?1:0); });
  out.total = total; return out;
}
// change in MY expected roto points if I buy p at `price` (money spent instead on an average player)
function deltaMe(p, price){
  const me = M.teams[st.me]; if (me.open<=0 || price>me.left) return null;
  p._excl = true;
  const fill = fillerFor(me.left-price, me.open-1);
  p._excl = false;
  const tot = teamTotals([...me.roster.map(r=>r.p), p], fill);
  return rotoPoints(tot, M.teams.filter(o=>o!==me).map(o=>o.tot)).total - me.pts.total;
}
function maxBid(p){ // highest price at which buying p still beats spending that money elsewhere
  const me = M.teams[st.me]; if (me.open<=0) return 0;
  let lo=0, hi=me.left; if ((deltaMe(p,0)??-1) <= 0) return 0;
  if ((deltaMe(p,hi)??-1) > 0) return hi;
  for (let i=0;i<9;i++){ const mid=(lo+hi)/2; (deltaMe(p,mid) > 0) ? lo=mid : hi=mid; }
  return Math.floor(lo);
}

// ---------------------------------------------------------------- render
const $ = id => document.getElementById(id);
const f1 = x => x==null? "–" : (+x).toFixed(1), f0 = x => "$"+Math.round(x);
function verdict(p, bid){
  if (bid==null || isNaN(bid)) return "";
  if (bid > p.mymax) return `<span class="tag bad">Stop – over your max</span>`;
  if (bid < p.mymax*0.85) return `<span class="tag good">Undervalued – keep bidding</span>`;
  return `<span class="tag mid">Close to your max</span>`;
}
function renderNom(){
  const p = byName.get($("nomInput").value); const out = $("nomOut");
  if (!p){ out.innerHTML = `<p class="muted">Pick the player being nominated to see his live value, how much he adds to your team, and your max bid.</p>`; return; }
  if (M.sold.has(p.id)){ const s=M.sold.get(p.id); out.innerHTML=`<p>${p.name} already sold to ${st.teams[s.team].name} for $${s.price}.</p>`; return; }
  const bid = parseFloat($("curBid").value), hasBid = !isNaN(bid);
  const sgn = x => x==null? "–" : (x>=0?"+":"")+x.toFixed(2);
  const prem = x => { const d = x-p.live; return `${d>=0?"+":"−"}$${Math.abs(Math.round(d))}`+(p.live>0?` (${d>=0?"+":"−"}${Math.abs(Math.round(d/p.live*100))}%)`:""); };
  const dBid = hasBid ? deltaMe(p, bid) : null;
  // premium ladder: my expected roto-point gain at a few prices between live and my max
  const steps = [...new Set([0,0.1,0.2,0.3,0.4].map(f=>Math.round(p.live*(1+f))).concat(p.mymax))].filter(x=>x<=M.teams[st.me].left).sort((a,b)=>a-b);
  const ladder = p.live>0 && p.mymax>0 ? `<div class="scroll" style="margin-top:10px"><table style="width:auto"><thead><tr><th class="l">Bid</th>${steps.map(x=>`<th>$${x}</th>`).join("")}</tr></thead><tbody>
    <tr><td class="l muted">vs live</td>${steps.map(x=>`<td class="muted">${x===p.mymax?"max":prem(x)}</td>`).join("")}</tr>
    <tr><td class="l muted">+My pts</td>${steps.map(x=>{const d=deltaMe(p,x);return `<td class="${d>0?"zp":"zn"}">${sgn(d)}</td>`}).join("")}</tr></tbody></table></div>` : "";
  out.innerHTML = `<div class="nom">
    <div><div class="muted">${p.pos} · ${p.team} · exp GP ${f1(p.exp_gp)}</div><div class="big">${p.name}</div></div>
    <div><div class="muted">Live market value</div><div class="big">${f0(p.live)}</div><div class="muted">start ${f0(p.base)}</div></div>
    <div><div class="muted">Your max bid</div><div class="big">${f0(p.mymax)}</div><div class="muted">budget left $${M.teams[st.me].left}</div></div>
    <div><div class="muted">Your roto pts at market</div><div class="big">${sgn(p.dme)}</div></div>
    <div><div class="muted">Your roto pts at ${hasBid?"$"+bid:"your bid"}</div><div class="big ${dBid==null?"":dBid>0?"zp":"zn"}">${hasBid?(dBid==null?"over budget":sgn(dBid)):"–"}</div><div class="muted">${hasBid?prem(bid)+" vs live":"type a bid above"}</div></div>
    <div><div class="muted">Verdict</div><div style="margin-top:6px">${verdict(p,bid)||'<span class="muted">enter current bid</span>'}</div></div>
  </div>${ladder}
  <div class="muted" style="margin-top:8px">z per game: ${CATS.map(c=>`${c} <span class="${p["z_"+c]>=0?"zp":"zn"}">${p["z_"+c].toFixed(1)}</span>`).join(" · ")} · past GP ${p.hist_gp||"rookie"}</div>`;
  $("soldPrice").value = isNaN(bid)? "" : bid;
}
function renderKpis(){
  const me = M.teams[st.me];
  $("kpis").innerHTML = [
    ["League $ left", "$"+M.money], ["Spots left", M.slots], ["Inflation", (M.inflation*100-100>=0?"+":"")+(M.inflation*100-100).toFixed(0)+"%"],
    ["My $ left", "$"+me.left], ["My spots", me.open], ["My proj. pts", me.rp.total+" / "+(CATS.filter(c=>st.weights[c]>0).length*S.teams)],
    ["My proj. rank", 1+M.teams.filter(t=>t.rp.total>me.rp.total).length]
  ].map(([k,v])=>`<div class="kpi">${k}<b>${v}</b></div>`).join("");
}
function renderTabs(){
  const tabs = [["board","Available players"],["teams","Teams & budgets"],["stand","Projected standings"],["log","Sales log"],["weights","Category weights"]];
  $("tabs").innerHTML = tabs.map(([k,v])=>`<button data-tab="${k}" class="${st.tab===k?"on":""}">${v}</button>`).join("") +
    `<span style="flex:1"></span><button id="exp">Export</button><label class="muted"><button onclick="document.getElementById('imp').click()">Import</button><input type="file" id="imp" accept=".json" hidden></label><button id="reset">Reset</button>`;
}
function renderBoard(){
  const cols = [["rank","#"],["name","Player","l"],["pos","Pos","l"],["exp_gp","Exp GP"],...CATS.map(c=>["z_"+c,c]),["zw","Z/g"],["base","Start $"],["live","Live $"],["mymax","My max"],["dme","+My pts"]];
  let rows = M.avail.filter(p=>!st.posFilter || p.pos.split(",").includes(st.posFilter));
  const k = st.sortKey; rows.sort((a,b)=> (typeof a[k]==="string" ? a[k].localeCompare(b[k]) : ((a[k]??-99)-(b[k]??-99))) * st.sortDir);
  $("view").innerHTML = `<div class="row" style="margin-bottom:8px"><span class="muted">Position</span>
    <select id="posF">${["","PG","SG","SF","PF","C"].map(x=>`<option ${st.posFilter===x?"selected":""} value="${x}">${x||"All"}</option>`).join("")}</select>
    <span class="muted">${rows.length} available · click a header to sort · click a row to nominate</span></div>
    <div class="scroll"><table><thead><tr>${cols.map(([k,v,c])=>`<th class="${c||""}" data-sort="${k}">${v}${st.sortKey===k?(st.sortDir<0?" ▾":" ▴"):""}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(p=>`<tr data-name="${p.name}"><td>${p.rank}</td><td class="l">${p.name}</td><td class="l pos">${p.pos}</td><td>${f1(p.exp_gp)}</td>
      ${CATS.map(c=>{const z=p["z_"+c];return `<td class="z ${z>=0.5?"zp":z<=-0.5?"zn":""}">${z.toFixed(1)}</td>`}).join("")}
      <td>${p.zw.toFixed(1)}</td><td>${f0(p.base)}</td><td><b>${f0(p.live)}</b></td><td>${f0(p.mymax)}</td>
      <td class="${p.dme>0?"zp":"zn"}">${p.dme==null?"–":p.dme.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>`;
}
function renderTeams(){
  $("view").innerHTML = `<p class="muted">Rename teams here. Click "Set as me" on your team.</p><div class="teams">${M.teams.map(t=>`
    <div class="team ${t.i===st.me?"me":""}"><input data-team="${t.i}" value="${t.name.replace(/"/g,"&quot;")}">
    <div class="row muted"><span>$${t.left} left</span><span>${t.open} spots</span><span>max bid $${t.maxBid}</span><span>${t.rp.total} pts</span></div>
    ${t.i===st.me?'<span class="tag good">You</span>':`<button data-me="${t.i}">Set as me</button>`}
    <ul>${t.roster.map(r=>`<li>${r.p.name} <span class="pos">${r.p.pos}</span> – $${r.price}</li>`).join("")}</ul>
    <div class="muted">${posCoverage(t.roster.map(r=>r.p))}</div></div>`).join("")}</div>`;
}
function posCoverage(ps){
  const miss = ["PG","SG","SF","PF","C"].filter(x=>!ps.some(p=>p.pos.split(",").includes(x)));
  return ps.length ? (miss.length? "Still need: "+miss.join(", ") : "All 5 positions covered") : "";
}
function renderStand(){
  const ts = [...M.teams].sort((a,b)=>b.rp.total-a.rp.total || b.pts.total-a.pts.total);
  $("view").innerHTML = `<p class="muted">Projected roto points per category: the 14 projected teams are ranked in each category (14 = best, 1 = worst). Empty spots are filled with the average player each team's remaining budget can buy. Exact ties are broken by money left.</p>
  <div class="scroll"><table><thead><tr><th class="l">Team</th>${CATS.map(c=>`<th>${c}</th>`).join("")}<th>Total</th></tr></thead><tbody>
  ${ts.map(t=>`<tr class="${t.i===st.me?"mine":""}"><td class="l">${t.name}</td>${CATS.map(c=>`<td>${t.rp[c]}</td>`).join("")}<td><b>${t.rp.total}</b></td></tr>`).join("")}
  </tbody></table></div>`;
}
function renderLog(){
  $("view").innerHTML = st.sales.length ? `<table><thead><tr><th class="l">#</th><th class="l">Player</th><th class="l">Team</th><th>Price</th><th>Start $</th><th></th></tr></thead><tbody>
  ${st.sales.map((s,i)=>({s,i})).reverse().map(({s,i})=>`<tr><td class="l">${i+1}</td><td class="l">${P[s.pid].name}</td><td class="l">${st.teams[s.team].name}</td><td>$${s.price}</td><td>${f0(P[s.pid].base)}</td><td><button data-undo="${i}">Remove</button></td></tr>`).join("")}</tbody></table>`
  : `<p class="muted">No sales yet.</p>`;
}
function renderWeights(){
  $("view").innerHTML = `<p class="muted">1 = normal. Set a category to 0 to punt it (it stops counting toward your value). Changes re-price every player.</p><div class="wgrid">
  ${CATS.map(c=>`<label>${c} <b id="wv-${c}">${st.weights[c]}</b><br><input type="range" min="0" max="2" step="0.1" value="${st.weights[c]}" data-w="${c}" style="width:100%"></label>`).join("")}</div>`;
}
function render(){
  rebuild(); renderKpis(); renderTabs(); renderNom();
  $("soldTeam").innerHTML = st.teams.map((t,i)=>`<option value="${i}">${t.name}</option>`).join("");
  $("plist").innerHTML = M.avail.map(p=>`<option value="${p.name}">`).join("");
  ({board:renderBoard,teams:renderTeams,stand:renderStand,log:renderLog,weights:renderWeights})[st.tab]();
  save();
}

// ---------------------------------------------------------------- events
document.addEventListener("click", e=>{
  const t = e.target;
  if (t.dataset.tab){ st.tab=t.dataset.tab; render(); }
  else if (t.dataset.sort){ st.sortDir = st.sortKey===t.dataset.sort ? -st.sortDir : -1; st.sortKey=t.dataset.sort; render(); }
  else if (t.dataset.me){ st.me=+t.dataset.me; render(); }
  else if (t.dataset.undo){ st.sales.splice(+t.dataset.undo,1); render(); }
  else if (t.id==="reset"){ if (prompt('Type RESET to clear all sales and teams')==="RESET"){ st=defaults(); render(); } }
  else if (t.id==="exp"){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,1)],{type:"application/json"})); a.download="auction-state.json"; a.click(); }
  else if (t.closest("tr[data-name]")){ $("nomInput").value=t.closest("tr").dataset.name; $("curBid").value=""; renderNom(); window.scrollTo({top:0,behavior:"smooth"}); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if (t.id==="posF"){ st.posFilter=t.value; render(); }
  else if (t.dataset.team){ st.teams[+t.dataset.team].name=t.value; render(); }
  else if (t.dataset.w){ st.weights[t.dataset.w]=+t.value; render(); }
  else if (t.id==="imp" && t.files[0]){ t.files[0].text().then(x=>{ st={...defaults(),...JSON.parse(x)}; render(); }); }
});
document.addEventListener("input", e=>{ if (e.target.dataset.w) $("wv-"+e.target.dataset.w).textContent=e.target.value; });
$("nomInput").addEventListener("input", renderNom);
$("curBid").addEventListener("input", renderNom);
$("soldBtn").addEventListener("click", ()=>{
  const p = byName.get($("nomInput").value), team=+$("soldTeam").value, price=Math.round(+$("soldPrice").value);
  if (!p || M.sold.has(p.id)) return $("msg").textContent="Pick an available player first.";
  const t = M.teams[team];
  if (t.open<=0) return $("msg").textContent=t.name+" has no open spots.";
  if (!(price>=0) || price>t.left) return $("msg").textContent=`Price must be between $0 and $${t.left}.`;
  st.sales.push({pid:p.id, team, price}); $("msg").textContent=`${p.name} → ${t.name} $${price}`;
  $("nomInput").value=""; $("curBid").value=""; $("soldPrice").value=""; render();
});
render();
</script>
</body>
</html>
